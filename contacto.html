    <style>
    .contact-container {
      max-width: 600px;
      margin: 100px auto 40px;
      background-color: #1a51b6;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px #0964af99;
    }

    .contact-container h2 {
      color: #ffffff;
      margin-bottom: 20px;
      text-align: center;
    }

    .contact-container p {
      color: #ffffff;
      margin-bottom: 20px;
      text-align: center;
    }

    .contact-container label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ffffff;
    }

    .contact-container input,
    .contact-container textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-bottom: 15px;
      background-color: #f6edfb;
      color: #000000;
    }

    .contact-container button {
      background-color: #e50914;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    .contact-container button:hover {
      background-color: #b00610;
    }

    .mensaje {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .mensaje.exito {
      color: #00ff88;
    }

    .mensaje.error {
      color: #ff4d4d;
    }
  </style>

    <div class="contact-container">
       <h2>Contacto</h2>
      <p>Esta copia de revisión no envía datos. Para contactar al equipo utiliza el sitio web oficial.</p>
      <form id="formulario-contacto" action="#">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" name="email" id="email" required />

        <label for="mensaje">Mensaje:</label>
        <textarea name="mensaje" id="mensaje" rows="5" required></textarea>

        <button type="button" disabled aria-disabled="true">Formulario desactivado en esta copia</button>
        <div id="mensaje-envio" class="mensaje"></div>
      </form>
    </div>
  </main>
